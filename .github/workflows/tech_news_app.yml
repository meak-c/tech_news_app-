name: Tech News Morning

on:
  schedule:
    - cron: "7 18 * * *"
  workflow_dispatch:

concurrency:
  group: tech-news-morning
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      page-ready: ${{ steps.page.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: collector/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.23"
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install collector
        run: uv sync --project collector --locked --all-extras

      - name: Install web
        working-directory: web
        run: npm ci

      - name: Run collector tests
        run: uv run --project collector pytest collector

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Fetch news and export news.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: uv run --project collector python -m tech_news_app.main

      - name: Persist SQLite database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.sqlite
          if git diff --cached --quiet; then
            echo "Database did not change."
          else
            git commit -m "chore: update tech news database"
            git push
          fi

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

      - name: Mark page ready
        id: page
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: needs.build.outputs.page-ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
